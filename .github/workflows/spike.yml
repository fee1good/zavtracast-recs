name: whisper-speed-spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: large-v3-turbo, beam: 5 }
          - { model: large-v3-turbo, beam: 1 }
          - { model: medium, beam: 1 }
          - { model: small, beam: 5 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: nproc && free -g
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install faster-whisper==1.2.1 av==18.1.0
      - name: cut 20 min sample from episode 394
        run: |
          ffmpeg -nostdin -loglevel error -ss 3600 -t 1200 \
            -i https://media.blubrry.com/zavtracast/zavtracast.ru/p/zavtracast394-datakrash.mp3 \
            -ac 1 -ar 16000 sample.wav
      - name: transcribe
        run: python spike/spike.py sample.wav ${{ matrix.model }} ${{ matrix.beam }}

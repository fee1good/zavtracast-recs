name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      episode:
        description: episode number to reprocess
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "site/**"
      - "internal/site/**"

concurrency:
  group: update
  cancel-in-progress: false

env:
  MIN_EPISODE: "386"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      count: ${{ steps.d.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: fee1good/zavtracast-recs-transcripts
          ssh-key: ${{ secrets.TRANSCRIPTS_DEPLOY_KEY }}
          path: .transcripts
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: d
        env:
          EPISODE: ${{ inputs.episode || '0' }}
        run: go run ./cmd/recs discover -min "$MIN_EPISODE" -episode "$EPISODE" >> "$GITHUB_OUTPUT"

  transcribe:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: transcribe/requirements.txt
      - run: pip install -r transcribe/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-large-v3-turbo-${{ hashFiles('transcribe/requirements.txt') }}
      - env:
          AUDIO_URL: ${{ matrix.audio_url }}
        run: curl -fsSL --retry 3 -o episode.mp3 "$AUDIO_URL"
      - env:
          EPISODE: ${{ matrix.episode }}
        run: >-
          python transcribe/transcribe.py --audio episode.mp3
          --episode "$EPISODE" --out "$EPISODE.json"
      - uses: actions/upload-artifact@v7
        with:
          name: transcript-${{ matrix.episode }}
          path: ${{ matrix.episode }}.json
          retention-days: 7

  classify:
    needs: [discover, transcribe]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: fee1good/zavtracast-recs-transcripts
          ssh-key: ${{ secrets.TRANSCRIPTS_DEPLOY_KEY }}
          path: .transcripts
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: transcript-*
          merge-multiple: true
          path: .transcripts
      - name: push transcripts
        working-directory: .transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: add transcripts"
            git push
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: classify
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECS_GEMINI_MODEL: ${{ vars.RECS_GEMINI_MODEL }}
          EPISODE: ${{ inputs.episode || '0' }}
        run: go run ./cmd/recs classify -min "$MIN_EPISODE" -episode "$EPISODE"
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/episodes
          if [ -n "$(git status --porcelain data/episodes)" ]; then
            git commit -m "chore(data): update episodes"
            git pull --rebase
            git push
          fi
      - if: steps.classify.outcome == 'failure'
        run: exit 1

  publish:
    needs: [discover, classify]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
        run: >-
          go run ./cmd/recs build -out _site
          -goatcounter "$GOATCOUNTER_CODE"
          -google-verification "$GOOGLE_SITE_VERIFICATION"
          -yandex-verification "$YANDEX_VERIFICATION"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
